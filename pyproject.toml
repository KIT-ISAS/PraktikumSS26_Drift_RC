[tool.ruff]
line-length = 99  # ROS2 ament_flake uses 99

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # import sorting (replaces flake8-import-order/isort)
    "D",  # docstrings (pep257/pydocstyle)
    "D213",  # multi-line docstring summary should start at the first line,
    "D413", # Missing blank line after last section
    "D407",  # Missing dashed underline after section
]
ignore = [ # compare /opt/ros/jazzy/lib/python3.12/site-packages/ament_flake8/configuration/ament_flake8.ini 
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D212",
    "D404",
    "D401",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["agent_pkg","car_localization_pkg","holodeck_pkg","joystick_pkg","shared_interfaces","shared_pkg","simulation_pkg","steamvr_pkg","track_pkg","vehicle_communication_pkg","vehicle_simulation"]
