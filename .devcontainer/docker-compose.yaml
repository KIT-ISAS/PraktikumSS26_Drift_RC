services:
  ros2:
    image: ros2-image
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    stdin_open: true
    tty: true

    volumes:
      - ..:/workspace
      - ../.:/root/repo

    working_dir: /root/repo/drift_ws

    network_mode: host

    environment:
      - ROS_DOMAIN_ID=0

    command: bash
