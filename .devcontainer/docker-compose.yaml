services:
  ros2:
    image: ros2-image
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    ports:
      - "8765:8765" # For ROS2 communication (DDS)

    stdin_open: true
    tty: true

    volumes:
      - ..:/workspace
      - ../.:/root/repo

    working_dir: /root/repo/drift_ws

    environment:
      - ROS_DOMAIN_ID=0

    command: bash
