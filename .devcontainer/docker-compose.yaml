services:
  ros2:
    image: ros2-image
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    # Allow pygame/SDL inside the container to see Linux input devices such as
    # /dev/input/js* and /dev/input/event*.
    device_cgroup_rules:
      - "c 13:* rmw"

    ports:
      - "8765:8765" # For ROS2 communication (DDS)

    stdin_open: true
    tty: true

    volumes:
      - ..:/workspace
      - ../.:/root/repo
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro

    working_dir: /root/repo/drift_ws

    environment:
      - ROS_DOMAIN_ID=0

    command: bash
