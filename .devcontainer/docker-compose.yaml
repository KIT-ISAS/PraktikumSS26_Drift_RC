services:
  ros2:
    image: ${IMAGE_NAME:-ros2-image}:${IMAGE_TAG:-latest} # Use the built image from the CI pipeline, fallback to 'latest' if not available
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
      
    network_mode: host
    ports:
      - 8765:8765 # For Foxglove Bridge communication

    stdin_open: true
    tty: true

    volumes:
      - ..:/root/repo # This workspace here is mounted to /root/repo in the container
      - ~/.claude:/root/.claude # Persist Claude Code auth and session history across container rebuilds
      - ~/.config/gh:/root/.config/gh # Share host's GitHub CLI auth (gh) with the container
      - bash-history:/commandhistory # Persist shell history across container rebuilds
      - /dev/input:/dev/input # For input devices (Joystick) access
      - /run/udev:/run/udev:ro # To detect plugging-in/out events for input devices

    # Allow SDL inside the container to see Linux input devices such as
    # /dev/input/js* and /dev/input/event*.
    device_cgroup_rules:
      - "c 13:* rmw"

    working_dir: /root/repo/drift_ws

    environment:
      - ROS_DOMAIN_ID=0
      - GH_TOKEN=${GH_TOKEN} # Pass the GitHub token from the host environment

    post_start:
      - command: /bin/bash -c ". /root/repo/.devcontainer/scripts/post_start.sh"
        user: root
    command: bash

volumes:
  bash-history: # Named volume backing /commandhistory so shell history outlives rebuilds
