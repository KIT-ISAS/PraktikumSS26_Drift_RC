name: ROS 2 CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  IMAGE_NAME: ros2-image

jobs:
  format:
    name: Format Code
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker compose -f .devcontainer/docker-compose.yaml build

      - name: Start Dev Container
        run: docker compose -f .devcontainer/docker-compose.yaml up -d

      - name: Run Formatter
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            source /opt/ros/jazzy/setup.bash &&
            source /opt/venv/bin/activate &&
            echo 'Run formatting tools here'
          "

      - name: Export Docker Image
        run: docker save $IMAGE_NAME -o ros2-image.tar

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: ros2-image
          path: ros2-image.tar

      - name: Stop Dev Container
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yaml down

  build:
    name: Build Workspace
    runs-on: ubuntu-24.04
    needs: format

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: ros2-image

      - name: Load Docker Image
        run: docker load -i ros2-image.tar

      - name: Start Dev Container
        run: docker compose -f .devcontainer/docker-compose.yaml up -d

      - name: Install ROS Dependencies
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            sudo rosdep update &&
            rosdep install --from-paths src --ignore-src -r -y
          "

      - name: Build Workspace
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            source /opt/ros/jazzy/setup.bash &&
            source /opt/venv/bin/activate &&
            colcon build --event-handlers console_direct+
          "

      - name: Upload Workspace Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ros2-workspace
          path: |
            build/
            install/
            log/

      - name: Stop Dev Container
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yaml down

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: ros2-image

      - name: Load Docker Image
        run: docker load -i ros2-image.tar

      - name: Download Workspace Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ros2-workspace

      - name: Start Dev Container
        run: docker compose -f .devcontainer/docker-compose.yaml up -d

      - name: Run Tests
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            source /opt/ros/jazzy/setup.bash &&
            source /opt/venv/bin/activate &&
            source install/setup.bash &&
            colcon test \
              --event-handlers console_direct+ \
              --pytest-args '-m not linter'
          "

      - name: Check Test Results
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            source /opt/ros/jazzy/setup.bash &&
            colcon test-result --all --verbose
          "

      - name: Stop Dev Container
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yaml down

  lint:
    name: Lint Code
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: ros2-image

      - name: Load Docker Image
        run: docker load -i ros2-image.tar

      - name: Download Workspace Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ros2-workspace

      - name: Start Dev Container
        run: docker compose -f .devcontainer/docker-compose.yaml up -d

      - name: Run Linters
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            source /opt/ros/jazzy/setup.bash &&
            source /opt/venv/bin/activate &&
            source install/setup.bash &&
            colcon test \
              --event-handlers console_direct+ \
              --pytest-args '-m linter'
          "

      - name: Check Lint Results
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            colcon test-result --all --verbose
          "

      - name: Stop Dev Container
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yaml down