name: ROS 2 CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/kit-isas/praktikumss26_drift_rc/ros2-image
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-docker-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker compose -f .devcontainer/docker-compose.yaml build

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG

  format:
    name: Format Code
    runs-on: ubuntu-24.04
    needs: build-docker-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker Image
        run: |
          docker pull $IMAGE_NAME:$IMAGE_TAG

      - name: Start Dev Container
        run: |
          docker compose -f .devcontainer/docker-compose.yaml up -d

      - name: Run Formatter
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            source /opt/ros/jazzy/setup.bash &&
            source /opt/venv/bin/activate &&
            ruff format --check src/
          "

      - name: Stop Dev Container
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yaml down

  build:
    name: Build Workspace
    runs-on: ubuntu-24.04
    needs: format

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker Image
        run: |
          docker pull $IMAGE_NAME:$IMAGE_TAG

      - name: Start Dev Container
        run: |
          docker compose -f .devcontainer/docker-compose.yaml up -d

      - name: Install ROS Dependencies
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            sudo rosdep update &&
            rosdep install --from-paths src --ignore-src -r -y
          "

      - name: Build Workspace
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            source /opt/ros/jazzy/setup.bash &&
            colcon build --event-handlers console_direct+
          "

      - name: Stop Dev Container
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yaml down

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker Image
        run: |
          docker pull $IMAGE_NAME:$IMAGE_TAG

      - name: Start Dev Container
        run: |
          docker compose -f .devcontainer/docker-compose.yaml up -d

      - name: Build Workspace
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            source /opt/ros/jazzy/setup.bash &&
            colcon build --event-handlers console_direct+
          "

      - name: Run Tests
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            source /opt/ros/jazzy/setup.bash &&
            source install/setup.bash &&
            colcon test \
              --event-handlers console_direct+ \
              --pytest-args '-m not linter'
          "

      - name: Check Test Results
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            source /opt/ros/jazzy/setup.bash &&
            colcon test-result --all --verbose
          "

      - name: Stop Dev Container
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yaml down

  library-test:
    name: Run Library Tests
    runs-on: ubuntu-24.04
    needs: build-docker-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker Image
        run: |
          docker pull $IMAGE_NAME:$IMAGE_TAG

      - name: Start Dev Container
        run: |
          docker compose -f .devcontainer/docker-compose.yaml up -d
      
      # The DriftEnv and SAC end-to-end smoke tests skip themselves via
      # pytest.importorskip when the RL dependencies are missing, so today the
      # pipeline never runs them. Install the pinned CPU-only extra (the +cpu
      # torch wheel is only served by the PyTorch CPU index — see the note in
      # vehicle_simulation/pyproject.toml). Installed into /opt/venv per the
      # image's PEP 668 convention; the system python3 that runs pytest sees it
      # through the PYTHONPATH append baked into the image.
      - name: Install RL test dependencies
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c '
            /opt/venv/bin/python -m pip install --upgrade pip &&
            /opt/venv/bin/pip install pytest &&
            /opt/venv/bin/pip install -e "/root/repo/drift_ws/src/vehicle_simulation[rl-cpu]" \
              --extra-index-url https://download.pytorch.org/whl/cpu &&
            /opt/venv/bin/python -c "import pytest, gymnasium, stable_baselines3, torch; print(\"RL deps available\", torch.__version__)"
          '

      - name: Run Library Tests
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c '
            cd /root/repo/drift_ws &&
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 /opt/venv/bin/python -m pytest src/vehicle_simulation/tests -v -rs
          '

      - name: Stop Dev Container
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yaml down

  lint:
    name: Lint Code
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker Image
        run: |
          docker pull $IMAGE_NAME:$IMAGE_TAG

      - name: Start Dev Container
        run: |
          docker compose -f .devcontainer/docker-compose.yaml up -d

      - name: Build Workspace
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            source /opt/ros/jazzy/setup.bash &&
            colcon build --event-handlers console_direct+
          "

      - name: Run Linters
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            source /opt/ros/jazzy/setup.bash &&
            source install/setup.bash &&
            colcon test \
              --event-handlers console_direct+ \
              --pytest-args '-m linter'
          "

      - name: Check Lint Results
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "
            colcon test-result --all --verbose
          "

      - name: Stop Dev Container
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yaml down