name: ROS 2 CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Lint, Format, and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Dev Container
        run: docker compose -f .devcontainer/docker-compose.yaml up -d --build

      - name: Format
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "\
            source /opt/ros/jazzy/setup.bash && \
            source /opt/venv/bin/activate && \
            # Replace with your specific format command if needed (like black or ament_uncrustify)
            echo 'Formatting step' "

      - name: Build Workspace
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "\
            source /opt/ros/jazzy/setup.bash && \
            source /opt/venv/bin/activate && \
            colcon build --event-handlers console_direct+"

      - name: Run Tests
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "\
            source /opt/ros/jazzy/setup.bash && \
            source /opt/venv/bin/activate && \
            source install/setup.bash && \
            colcon test --event-handlers console_direct+"

      - name: Lint
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "\
            source /opt/ros/jazzy/setup.bash && \
            source /opt/venv/bin/activate && \
            colcon test --packages-select test_pkg --pytest-args -m 'linter' || true"

      - name: Check Test Results
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "\
            source /opt/ros/jazzy/setup.bash && \
            source /opt/venv/bin/activate && \
            colcon test-result --all --verbose"

      - name: Stop Dev Container
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yaml down
