name: ROS 2 CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker compose -f .devcontainer/docker-compose.yaml build

      - name: Save Docker image
        run: docker save $(docker compose -f .devcontainer/docker-compose.yaml images -q) -o /tmp/ros2-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/ros2-image.tar
          retention-days: 1

  format:
    name: Format Code
    runs-on: ubuntu-24.04
    needs: build-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/ros2-image.tar

      - name: Start Dev Container
        run: docker compose -f .devcontainer/docker-compose.yaml up -d

      - name: Format
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "\
            source /opt/ros/jazzy/setup.bash && \
            source /opt/venv/bin/activate && \
            # Replace with your specific format command if needed (like black or ament_uncrustify)
            echo 'Formatting check' "

      - name: Stop Dev Container
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yaml down

  build:
    name: Build Workspace
    runs-on: ubuntu-24.04
    needs: format

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/ros2-image.tar

      - name: Start Dev Container
        run: docker compose -f .devcontainer/docker-compose.yaml up -d

      - name: Build Workspace
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "\
            source /opt/ros/jazzy/setup.bash && \
            source /opt/venv/bin/activate && \
            colcon build --event-handlers console_direct+"

      - name: Stop Dev Container
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yaml down

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/ros2-image.tar

      - name: Start Dev Container
        run: docker compose -f .devcontainer/docker-compose.yaml up -d

      - name: Build Workspace
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "\
            source /opt/ros/jazzy/setup.bash && \
            source /opt/venv/bin/activate && \
            colcon build --event-handlers console_direct+"

      - name: Run Tests
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "\
            source /opt/ros/jazzy/setup.bash && \
            source /opt/venv/bin/activate && \
            source install/setup.bash && \
            colcon test --event-handlers console_direct+ --pytest-args '-m not linter'"

      - name: Check Test Results
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "\
            source /opt/ros/jazzy/setup.bash && \
            source /opt/venv/bin/activate && \
            colcon test-result --all --verbose"

      - name: Stop Dev Container
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yaml down

  lint:
    name: Lint Code
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/ros2-image.tar

      - name: Start Dev Container
        run: docker compose -f .devcontainer/docker-compose.yaml up -d

      - name: Build Workspace
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "\
            source /opt/ros/jazzy/setup.bash && \
            source /opt/venv/bin/activate && \
            colcon build --event-handlers console_direct+"

      - name: Lint
        run: |
          docker compose -f .devcontainer/docker-compose.yaml exec -T ros2 bash -c "\
            source /opt/ros/jazzy/setup.bash && \
            source /opt/venv/bin/activate && \
            colcon test --event-handlers console_direct+ --pytest-args '-m linter'"

      - name: Stop Dev Container
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yaml down
