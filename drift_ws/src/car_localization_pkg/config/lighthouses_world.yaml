# Reference positions of the lighthouses in the physical world frame [m].
#
# This is the anchor of the shared "world" frame for the SteamVR path: the
# steamvr_calibrate script fits world -> steamvr_world against these, and
# steamvr_node warns at startup when a live-solved lighthouse deviates from
# its entry (moved lighthouse or stale calibration).
#
# Serials are SteamVR's LHB-<id in hex>; the values were computed from the
# libsurvive calibration (libsurvive_pkg/config/config.json lighthouse
# poses mapped through the world transform in libsurvive_pkg/src/component.cpp),
# so both tracking sources agree on the same world frame. If the lighthouses
# are physically rearranged, re-measure/re-derive these AND recalibrate both
# sources.
lighthouses:
  LHB-12B51265: [-2.673, -2.352, 2.183]  # libsurvive lighthouse0 (id 313856613)
  LHB-2042C89A: [-2.644, 2.349, 2.190]   # libsurvive lighthouse1 (id 541247642)
  LHB-6BDF6491: [2.740, 2.315, 2.207]    # libsurvive lighthouse2 (id 1809802385)
  LHB-132B7D13: [2.778, -2.313, 2.280]   # libsurvive lighthouse3 (id 321617171)
