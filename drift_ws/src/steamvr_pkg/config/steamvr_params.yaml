/**:
  ros__parameters:
    # UDP endpoint the host-side bridge (steamvr_bridge/) sends to.
    bind_address: "127.0.0.1"
    udp_port: 15250

    # Serial of the car's tracker. Empty = lock onto the first tracker seen;
    # set it when a second tracker/controller may be live.
    tracker_serial: ""

    # ---------------------------------------------------------------------
    # Calibration of world -> steamvr_world (metres / degrees).
    # The SteamVR analogue of the world offset hardcoded in holodeck's
    # component.cpp — tune per the procedure in the package README, and
    # re-tune after redoing SteamVR room setup (the Standing-universe origin
    # can shift).
    # ---------------------------------------------------------------------
    world_x: 0.0
    world_y: 0.0
    world_z: 0.0
    world_yaw_deg: 0.0

    # Pseudo-IMU: add +g up so it reads specific force like a real
    # accelerometer at rest.
    include_gravity: true

    # Latch lighthouse TFs and publish /map/lighthouses (calibration aid).
    publish_lighthouses: true

    # Warn when no bridge datagrams arrive for this long [s].
    stale_timeout_s: 1.0
