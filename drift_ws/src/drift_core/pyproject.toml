[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drift_core"
version = "0.1.0"
requires-python = ">=3.10"
# Base deps keep the core lightweight (track geometry + ROS-free utilities).
# Heavier, optional pieces (torch models, RL, plots) are added as extras in the
# feature PRs that introduce them.
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "rosbags",
]

[project.optional-dependencies]
neural = ["torch"]  # torch-based models (neural/dynamic/hybrid) + training
rl = ["gymnasium==1.3.0", "stable-baselines3==2.9.0"]  # DriftEnv / RL-agent training (lockstep with rl-cpu)
eval = ["matplotlib"]  # evaluation plots
all = ["torch", "gymnasium==1.3.0", "stable-baselines3==2.9.0", "matplotlib"]
# CPU-only inference for a deploy/robot machine with no GPU: run a trained
# DriftAgent (loads a SAC .zip) without the multi-GB CUDA torch. Versions are
# pinned to the training checkpoints so SB3 loads them without warnings. torch is
# the `+cpu` wheel, which only the PyTorch CPU index serves, so install with:
#   pip install -e "drift_ws/src/drift_core[rl-cpu]" \
#       --extra-index-url https://download.pytorch.org/whl/cpu
rl-cpu = ["torch==2.12.1+cpu", "stable-baselines3==2.9.0", "gymnasium==1.3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["drift_core*"]

[tool.setuptools.package-data]
"drift_core.track" = ["tracks/*.yaml"]
"drift_core.vehicle_model" = ["cars/*.yaml"]
"drift_core.agent.environments" = ["configs/*.yaml"]
